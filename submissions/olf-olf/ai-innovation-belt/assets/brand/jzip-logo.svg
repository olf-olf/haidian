<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="京张智脉 Jing-Zhang Intelligence Pulse (JZIP) logo">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="railg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- rail track base -->
  <g stroke="#0f172a" stroke-width="6" fill="none" opacity="0.9">
    <line x1="60" y1="180" x2="580" y2="180"/>
    <line x1="60" y1="196" x2="580" y2="196"/>
  </g>
  <!-- rail ties -->
  <g stroke="#475569" stroke-width="4" opacity="0.55">
    <line x1="120" y1="168" x2="132" y2="208"/>
    <line x1="200" y1="168" x2="212" y2="208"/>
    <line x1="280" y1="168" x2="292" y2="208"/>
    <line x1="360" y1="168" x2="372" y2="208"/>
    <line x1="440" y1="168" x2="452" y2="208"/>
    <line x1="520" y1="168" x2="532" y2="208"/>
  </g>

  <!-- neural-pulse overlay flowing along the rail -->
  <path d="M 100 250 Q 160 150 220 210 T 340 200 T 460 210 T 560 150"
        stroke="url(#pulse)" stroke-width="10" fill="none" stroke-linecap="round"
        opacity="0.85">
    <animate attributeName="d"
             values="M 100 250 Q 160 150 220 210 T 340 200 T 460 210 T 560 150;
                     M 100 150 Q 160 250 220 190 T 340 200 T 460 190 T 560 250;
                     M 100 250 Q 160 150 220 210 T 340 200 T 460 210 T 560 150"
             dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- pulse nodes -->
  <g fill="#3b82f6">
    <circle cx="220" cy="210" r="9"/>
    <circle cx="340" cy="200" r="9"/>
    <circle cx="460" cy="210" r="9"/>
  </g>
  <g fill="#7c3aed">
    <circle cx="160" cy="200" r="6"/>
    <circle cx="280" cy="205" r="6"/>
    <circle cx="400" cy="205" r="6"/>
    <circle cx="520" cy="200" r="6"/>
  </g>

  <!-- wordmark -->
  <text x="320" y="90" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#0f172a">京张智脉</text>
  <text x="320" y="120" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#475569" letter-spacing="2">JING-ZHANG INTELLIGENCE PULSE</text>
  <text x="320" y="143" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3b82f6" letter-spacing="6">JZIP</text>

</svg>